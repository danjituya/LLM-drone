        \            - path: 飞行路径类型（仅支持zigzag/round/grid，无则填zigzag）\n            -\
        \ area_bounds: 农田边界坐标（固定为[0,0,200,150]，不可修改）\n            - has_obstacle:\
        \ 是否存在障碍（True/False，无则填False）\n            - obstacle_position: 障碍坐标（[x,y]，x∈[0,200],\
        \ y∈[0,150]，无则填None）\n            - height: 飞行高度（整数，5-30米，无则填10）\n       \
        \     【兜底规则】解析失败时返回：\n            {{\n                \"area\": \"default_farm\"\
        ,\n                \"drone_num\": 3,\n                \"path\": \"zigzag\"\
        ,\n                \"area_bounds\": [0, 0, 200, 150],\n                \"\
        has_obstacle\": False,\n                \"obstacle_position\": None,\n   \
        \             \"height\": 10\n            }}\n            用户指令：{user_command}\n\
        \            严格按照以下格式输出，不要修改任何字段名：\n            ```python\n            dispatch_params\
        \ = {{\n                \"area\": \"\",\n                \"drone_num\": 3,\n\
