        \ y∈[0,150]，无则填None）\n            - height: 飞行高度（整数，5-30米，无则填10）\n       \
        \     【合法性校验规则】\n            1. drone_num必须是1-10的整数\n            2. path只能是zigzag/round/grid之一\n\
